# Free daily scheduler: calls the API once a day at 08:00 Lagos time (07:00 UTC).
# Set repo secrets: API_URL (e.g. https://assnow-api.onrender.com) and CRON_SECRET (same as backend).
name: daily-reminders
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and send reminders
        run: |
          curl -fsS --retry 5 --retry-delay 20 --max-time 90 "${{ secrets.API_URL }}/health"
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" "${{ secrets.API_URL }}/internal/run-reminders"
